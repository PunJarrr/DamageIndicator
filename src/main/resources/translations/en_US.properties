command.no-permission=<red>You don't have permission to use this command.
command.usage=<red>Unknown command. <yellow>Usage: /{command} [toggle|reload]
command.players-only=<red>Only players can turn damage numbers on or off. <yellow>To reload the config, use /{command} reload
command.toggle.on=<green>Damage numbers are now <bold>on</bold>. <gray>Type /{command} to turn them off.
command.toggle.off=<yellow>Damage numbers are now <bold>off</bold>. <gray>Type /{command} to turn them back on.
command.reload.success=<green>Reloaded configuration successfully!
command.reload.failed=<red>Failed to reload: <yellow>{error}
