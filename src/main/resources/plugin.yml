name: DamageIndicator
version: '${version}'
description: '${description}'

main: dev.punjarrr.damageIndicator.DamageIndicator
# The oldest version we support. One jar runs on every newer version too.
api-version: '1.19'
folia-supported: true
load: POSTWORLD

authors: [ PunJarrr ]
website: https://modrinth.com/plugin/damageindicator

commands:
  damageindicator:
    description: Turns damage numbers on or off for you, or reloads the config.
    usage: /<command> [toggle|reload]
    aliases: [ di ]
    # No permission here: each subcommand checks its own (see below)

permissions:
  damageindicator.toggle:
    description: Allows turning damage numbers on or off for yourself with /di.
    default: true
  damageindicator.reload:
    description: Allows reloading the DamageIndicator configuration.
    default: op
