name: DamageIndicator
version: '${version}'
description: '${description}'

main: dev.punjarrr.damageIndicator.DamageIndicator
# The oldest version we support. One jar runs on every newer version too.
api-version: '1.19'
folia-supported: true
load: POSTWORLD

authors: [ PunJarrr ]
website: https://modrinth.com/plugin/damageindicator

commands:
  damageindicator:
    description: DamageIndicator plugin command.
    usage: /damageindicator [reload]
    aliases: [ di ]
    permission: damageindicator.reload

permissions:
  damageindicator.reload:
    description: Allows reloading the DamageIndicator configuration.
    default: op
